<!DOCTYPE html>
<html class="login" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - FolioLabs</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login">
    <main class="login_main">
        <div class="login_div">

            <img class="logo_login" src="../img/logo.png" alt="logo">
            <h1 class="login_h3">Cadastro</h1>
            <form action="">
                <input type="text" name="name" class="input_dados" id="name" placeholder="Digite seu nome">
                <input type="text" name="login" class="input_dados" id="login" placeholder="Digite seu email">
                <input type="password" name="senha" class="input_dados" id="senha" placeholder="Digite sua senha">
                <input type="password" name="senha" class="input_dados" id="senha" placeholder="Confirme sua senha">
                <button class="botao_login" id="cadastrarUser">Cadastrar</button>
            </form>
            <a class="cadastro" href="../index.html">Já tem Cadastro? Clique aqui para voltar ao login</a>
        </div>
    </main>

    <script src="../js/server.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
