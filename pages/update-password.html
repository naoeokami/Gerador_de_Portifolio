<!DOCTYPE html>
<html class="login" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width, initial-scale=1.0">
    <title>Redefinir Senha - FolioLabs</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login">
    <main class="login_main">
        <div class="login_div">

            <img class="logo_login" src="../img/logo.png" alt="logo">
            <h1 class="login_h3">Redefinir Senha</h1>
            
            <!-- Formulário de Redefinição de Senha -->
            <form id="update-password-form">
                <p style="text-align: center; margin-bottom: 20px;">Defina sua nova senha:</p>
                <input type="password" name="new-password" class="input_dados" id="new-password" placeholder="Nova Senha" required>
                <input type="password" name="confirm-password" class="input_dados" id="confirm-password" placeholder="Confirme a Nova Senha" required>
                <button type="submit" class="botao_login">Redefinir Senha</button>
                <div id="message" style="margin-top: 15px; text-align: center; color: red;"></div>
            </form>

        </div>
    </main>

    <!-- Configuração e Dados Demo (Modo Demonstração Frontend) -->
    <script src="../js/supabase_config.js"></script>
    <script src="../js/init.js"></script>
    <script src="../js/auth.js"></script>
    
    <!-- Script principal para lidar com o formulário de redefinição -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const updatePasswordForm = document.getElementById('update-password-form');
            const newPasswordInput = document.getElementById('new-password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const messageDiv = document.getElementById('message');

            updatePasswordForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                messageDiv.textContent = ''; // Limpa mensagens anteriores

                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (newPassword !== confirmPassword) {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'As senhas não coincidem.';
                    return;
                }

                try {
                    await window.updatePassword(newPassword);
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'Senha redefinida com sucesso! Redirecionando para a tela de login...';
                    updatePasswordForm.reset();
                    setTimeout(() => {
                        window.location.href = '../index.html';
                    }, 1500);
                } catch (error) {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'Erro ao redefinir a senha: ' + error.message;
                }
            });
        });
    </script>
</body>

</html>
