<!DOCTYPE html>
<html class="login" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FolioLabs</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login">
    <main class="login_main">
        <div class="login_div">

            <img class="logo_login" src="img/logo.png" alt="logo">
            <h1 class="login_h3">Login</h1>
            <form action="">
                <input type="text" name="login" id="login" placeholder="usuário">
                <input type="password" name="senha" id="senha" placeholder="senha">
                <button class="botao_login">Acessar</button>
            </form>
            <a class="cadastro" href="pages/cadastro.html">Não tem Cadastro? Faça agora mesmo</a>
        </div>
    </main>
</body>

</html>
